[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transpyrancy"
version = "0.1.0"
description = "Transparent, SHAP-based ML explainability — batteries included."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "machine-learning",
    "explainability",
    "interpretability",
    "shap",
    "xai",
    "feature-importance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "shap>=0.44",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
xgboost    = ["xgboost>=2.0"]
lightgbm   = ["lightgbm>=4.0"]
catboost   = ["catboost>=1.2"]
torch      = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.12"]
all = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "torch>=2.0",
]
dev = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "notebook>=7.0",
]

[tool.setuptools.packages.find]
where   = ["."]
include = ["transpyrancy*"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short"

[tool.coverage.run]
source  = ["transpyrancy"]
omit    = ["tests/*", "notebooks/*"]
